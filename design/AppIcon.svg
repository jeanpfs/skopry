<?xml version="1.0" encoding="UTF-8"?>
<!-- Skopry's icon on the 1024 grid, a full-bleed square (iOS and macOS apply their own mask).
     Two stacked windows on the Mac, and the one you stream, in coral, moving right with an arrow.
     Flat, three colours: abyss #0B0F19, violet #4F46E5 (and #6366F1 for the lower window), coral #FF5733.
     The Android icon and the menu bar glyph use the same shapes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0B0F19"/>
  <g transform="translate(512 510) scale(1.2) translate(-520 -510)">
    <rect x="250" y="300" width="300" height="190" rx="30" fill="#4F46E5"/>
    <rect x="250" y="530" width="300" height="190" rx="30" fill="#6366F1"/>
    <g fill="#FFFFFF" fill-opacity="0.6">
      <circle cx="282" cy="330" r="9"/><circle cx="310" cy="330" r="9"/><circle cx="338" cy="330" r="9"/>
      <circle cx="282" cy="560" r="9"/><circle cx="310" cy="560" r="9"/><circle cx="338" cy="560" r="9"/>
    </g>
    <rect x="420" y="410" width="370" height="200" rx="32" fill="#FF5733"/>
    <g fill="#FFFFFF">
      <circle cx="456" cy="441" r="9"/><circle cx="484" cy="441" r="9"/><circle cx="512" cy="441" r="9"/>
    </g>
    <path d="M590 530H720M680 490L722 530L680 570" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
